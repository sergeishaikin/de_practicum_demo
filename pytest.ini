[pytest]
testpaths = tests
pythonpath = .
addopts = -m "not integration and not e2e and not airflow"
markers =
    integration: requires live local Compose dependencies (PostgreSQL, MinIO, REST catalog, or Trino)
    iceberg: exercises the real REST catalog / Iceberg tables
    trino: queries Trino over the iceberg connector
    e2e: full Kafka/Spark/lakehouse test
    airflow: Airflow DAG validation
    bdd: Gherkin behavior specifications executed through pytest-bdd
    domain: T1 BDD — pure-domain specification, no stack, runs in the default suite
    spike2: compares B2 PyIceberg physical layouts
    architecture: executable architecture fitness functions and cutover contracts

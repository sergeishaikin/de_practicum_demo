name: de-practicum-demo

networks:
  de_demo_net:
    name: de_demo_net
    driver: bridge

volumes:
  de_demo_pg_data:
    name: de_demo_pg_data
  de_demo_airflow_logs:
    name: de_demo_airflow_logs

services:
  de-demo-postgres:
    image: postgres:15
    container_name: de-demo-postgres
    hostname: de-demo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-dwh}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD is required}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:-airflow_meta}
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "15432:5432"
    volumes:
      - de_demo_pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/demo_sql:/demo_sql:ro
      - ./db/tasks:/tasks:ro
      - ./db/task_checks:/task_checks:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-dwh}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped
    networks:
      - de_demo_net

  airflow-db-init:
    image: postgres:15
    container_name: de-demo-airflow-db-init
    environment:
      PGHOST: de-demo-postgres
      PGPORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD is required}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:-airflow_meta}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint-initdb.d/006_airflow_metadata.sh"]
    depends_on:
      de-demo-postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - de_demo_net

  de-demo-airflow:
    image: local/airflow:3.3.1-lab
    pull_policy: never
    container_name: de-demo-airflow
    hostname: de-demo-airflow
    depends_on:
      airflow-db-init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Europe/Moscow}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: ${TZ:-Europe/Moscow}
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD is required}@de-demo-postgres:5432/${AIRFLOW_DB_NAME:-airflow_meta}
      AIRFLOW__API__INSTANCE_NAME: "DE Practicum · Local"
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?AIRFLOW_API_SECRET_KEY is required}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?AIRFLOW_JWT_SECRET is required}
      DWH_HOST: de-demo-postgres
      DWH_PORT: "5432"
      DWH_DB: ${POSTGRES_DB:-dwh}
      DWH_USER: ${POSTGRES_USER:-app}
      DWH_PASSWORD: ${POSTGRES_PASSWORD:-app}
      MAINTENANCE_RETENTION: ${MAINTENANCE_RETENTION:-2h}
      MAINTENANCE_RECOVERY_HORIZON: ${MAINTENANCE_RECOVERY_HORIZON:-1h}
      MAINTENANCE_RECOVERY_SAFETY_MARGIN: ${MAINTENANCE_RECOVERY_SAFETY_MARGIN:-15m}
    ports:
      - "127.0.0.1:${AIRFLOW_HOST_PORT:-18085}:8080"
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./db:/opt/airflow/project/db:ro
      - ./data/raw:/opt/airflow/project/data/raw:ro
      - de_demo_airflow_logs:/opt/airflow/logs
    command:
      - airflow
      - standalone
    restart: unless-stopped
    networks:
      - de_demo_net

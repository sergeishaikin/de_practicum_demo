# Bounded json-file logs. Without this the driver keeps every line forever, so a
# service in a restart loop writes unbounded log data into the Docker VM disk.
x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  minio:
    image: ${MINIO_IMAGE:?MINIO_IMAGE is required}
    container_name: de-demo-minio
    mem_limit: 1536m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - de_demo_minio_data:/data
    networks:
      - de_demo_net

  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: de-practicum-demo-spark:4.2.0-h1
    container_name: de-demo-spark-master
    mem_limit: 512m
    logging: *bounded-logging
    hostname: spark-master
    command:
      - /opt/spark/sbin/start-master.sh
    environment:
      SPARK_NO_DAEMONIZE: "true"
      PYSPARK_PYTHON: /usr/bin/python3
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_ENDPOINT: http://minio:9000
    ports:
      - "${SPARK_MASTER_UI_PORT}:8080"
      - "${SPARK_MASTER_PORT}:7077"
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./data:/opt/spark/data
    depends_on:
      minio:
        condition: service_started
    networks:
      - de_demo_net

  spark-worker:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: de-practicum-demo-spark:4.2.0-h1
    container_name: de-demo-spark-worker
    mem_limit: 3072m
    logging: *bounded-logging
    hostname: spark-worker
    command:
      - /opt/spark/sbin/start-worker.sh
      - spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "4"
      SPARK_WORKER_MEMORY: 2g
      # Worker cleanup is already enabled by default in Spark 4.2.0, but its
      # default 7-day appDataTtl never expires anything on a demo-length run.
      # A 15-minute TTL is the guardrail; the real fix is the `local:` JAR
      # scheme in spark/submit-with-runtime.sh, which stops the per-submission
      # staging entirely.
      SPARK_WORKER_OPTS: >-
        -Dspark.worker.cleanup.enabled=true
        -Dspark.worker.cleanup.interval=300
        -Dspark.worker.cleanup.appDataTtl=900
      SPARK_MASTER_URL: spark://spark-master:7077
      PYSPARK_PYTHON: /usr/bin/python3
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_ENDPOINT: http://minio:9000
    ports:
      - "${SPARK_WORKER_UI_PORT}:8081"
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./data:/opt/spark/data
    depends_on:
      spark-master:
        condition: service_started
    networks:
      - de_demo_net

  spark-connect:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: de-practicum-demo-spark:4.2.0-h1
    container_name: de-demo-spark-connect
    profiles: ["tools"]
    mem_limit: 1024m
    logging: *bounded-logging
    hostname: spark-connect
    command:
      - /opt/spark/sbin/start-connect-server.sh
      - --master
      - spark://spark-master:7077
      - --conf
      - spark.connect.grpc.binding.address=0.0.0.0
      - --conf
      - spark.connect.grpc.binding.port=15002
      - --conf
      - spark.driver.host=spark-connect
      - --conf
      - spark.driver.bindAddress=0.0.0.0
      - --conf
      - spark.driver.port=17078
      - --conf
      - spark.blockManager.port=17079
      - --conf
      - spark.executor.cores=2
      - --conf
      - spark.cores.max=2
      - --conf
      - spark.driver.memory=512m
      - --conf
      - spark.executor.memory=1g
    environment:
      SPARK_NO_DAEMONIZE: "true"
      PYSPARK_PYTHON: /usr/bin/python3
    ports:
      - "${SPARK_CONNECT_PORT}:15002"
      - "${SPARK_CONNECT_UI_PORT}:4040"
    depends_on:
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c '</dev/tcp/127.0.0.1/15002'"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - de_demo_net

  jupyter:
    build:
      context: ./jupyter
      dockerfile: Dockerfile
    image: de-practicum-demo-jupyter:spark420-h1
    container_name: de-demo-jupyter
    profiles: ["tools"]
    mem_limit: 1024m
    environment:
      SPARK_MASTER: spark://spark-master:7077
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64

      POSTGRES_HOST: de-demo-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_ENDPOINT: http://minio:9000
    ports:
      - "${JUPYTER_HOST_PORT}:8888"
    volumes:
      - ./jupyter:/home/jovyan/work
      - ./spark/jobs:/home/jovyan/work/jobs
      - ./data:/home/jovyan/work/data
    depends_on:
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - de_demo_net

  kafka:
    image: ${KAFKA_IMAGE:?KAFKA_IMAGE is required}
    container_name: de-demo-kafka
    hostname: kafka
    mem_limit: 1280m
    ports:
      - "${KAFKA_HOST_PORT}:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      # Keep broker records on a named volume so a container recreation does
      # not silently create a new Kafka offset epoch.  The mount and
      # KAFKA_LOG_DIRS value intentionally point at the same directory.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - de_demo_kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - de_demo_net

  kafka-ui:
    image: ${KAFKA_UI_IMAGE:?KAFKA_UI_IMAGE is required}
    container_name: de-demo-kafka-ui
    profiles: ["tools"]
    mem_limit: 512m
    ports:
      - "${KAFKA_UI_HOST_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - de_demo_net

  iceberg-rest:
    image: ${ICEBERG_REST_IMAGE:?ICEBERG_REST_IMAGE is required}
    container_name: de-demo-iceberg-rest
    hostname: iceberg-rest
    mem_limit: 768m
    user: "0:0"
    command:
      - java
      - -jar
      - /usr/lib/iceberg-rest/iceberg-rest-image-all.jar
    environment:
      CATALOG_URI: jdbc:postgresql://de-demo-postgres:5432/${POSTGRES_DB}
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_JDBC_USER: ${POSTGRES_USER}
      CATALOG_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
      CATALOG_JDBC_INITIALIZE: "false"
      CATALOG_JDBC_SCHEMA: ${ICEBERG_CATALOG_JDBC_SCHEMA:-public}
      CATALOG_WAREHOUSE: s3://de-practicum/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
    ports:
      - "${ICEBERG_REST_PORT}:8181"
    volumes:
      # Retain the SQLite catalog volume for rollback evidence; PostgreSQL is
      # the active catalog authority after the metadata-preserving migration.
      - de_demo_iceberg_catalog:/catalog:ro
    depends_on:
      de-demo-postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c '</dev/tcp/127.0.0.1/8181'"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - de_demo_net

  iceberg-writer:
    build:
      context: ./iceberg
      dockerfile: Dockerfile
    image: de-practicum-demo-iceberg:0.11.1-h1
    container_name: de-demo-iceberg-writer
    mem_limit: 384m
    logging: *bounded-logging
    working_dir: /app
    command:
      - python
      - writer/iceberg_writer.py
    environment:
      ICEBERG_CATALOG_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: s3://de-practicum/warehouse
      ICEBERG_NAMESPACE: bronze
      ICEBERG_TABLE: orders
      MINIO_BUCKET: de-practicum
      LANDING_PREFIX: streaming/orders_raw
      POLL_INTERVAL_SECONDS: "10"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      STATE_FILE: /state/ingested.json
      BRONZE_OUTBOX_PREFIX: ${BRONZE_OUTBOX_PREFIX:-streaming/bronze_outbox}
      POSTGRES_HOST: de-demo-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      METRICS_ENABLED: "1"
      PROMETHEUS_METRICS_PORT: "9101"
      OTEL_ENABLED: ${OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_TIMEOUT: ${OTEL_EXPORTER_OTLP_TIMEOUT:-5}
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-de-practicum}
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-local}
      OPENLINEAGE_NAMESPACE: ${OPENLINEAGE_NAMESPACE:-de-practicum}
      OPENLINEAGE_DISABLED: ${OPENLINEAGE_DISABLED:-}
      OPENLINEAGE__TRANSPORT__TYPE: ${OPENLINEAGE_TRANSPORT_TYPE:-file}
      OPENLINEAGE__TRANSPORT__LOG_FILE_PATH: /lineage/events.jsonl
      OPENLINEAGE__TRANSPORT__APPEND: "true"
    volumes:
      - ./iceberg:/app:ro
      - de_demo_iceberg_writer_state:/state
      - de_demo_lineage_events:/lineage
    depends_on:
      iceberg-rest:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    networks:
      - de_demo_net

  iceberg-medallion:
    build:
      context: ./iceberg
      dockerfile: Dockerfile
    image: de-practicum-demo-iceberg:0.11.1-h1
    container_name: de-demo-iceberg-medallion
    mem_limit: 2560m
    logging: *bounded-logging
    working_dir: /app
    command:
      - python
      - medallion/iceberg_medallion.py
    environment:
      ICEBERG_CATALOG_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: s3://de-practicum/warehouse
      BRONZE_NAMESPACE: bronze
      BRONZE_TABLE: orders
      SILVER_NAMESPACE: silver
      SILVER_TABLE: orders_clean
      GOLD_NAMESPACE: gold
      GOLD_TABLE: orders_daily_metrics
      MEDALLION_INTERVAL_SECONDS: "60"
      SILVER_MODE: ${SILVER_MODE:-legacy}
      GOLD_SOURCE: ${GOLD_SOURCE:-legacy}
      SHADOW_COMPARE: ${SHADOW_COMPARE:-0}
      MINIO_BUCKET: de-practicum
      BRONZE_OUTBOX_PREFIX: ${BRONZE_OUTBOX_PREFIX:-streaming/bronze_outbox}
      MEDALLION_PROGRESS_PATH: ${MEDALLION_PROGRESS_PATH:-streaming/medallion/progress.json}
      MEDALLION_COMPLETION_LEDGER_PREFIX: ${MEDALLION_COMPLETION_LEDGER_PREFIX:-streaming/medallion/completion-ledger}
      MEDALLION_SHADOW_RECEIPT_PATH: ${MEDALLION_SHADOW_RECEIPT_PATH:-streaming/medallion/shadow-certification.json}
      MAX_COMPLETED_PROGRESS: ${MAX_COMPLETED_PROGRESS:-100}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      POSTGRES_HOST: de-demo-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      METRICS_ENABLED: "1"
      PROMETHEUS_METRICS_PORT: "9102"
      OTEL_ENABLED: ${OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_TIMEOUT: ${OTEL_EXPORTER_OTLP_TIMEOUT:-5}
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-de-practicum}
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-local}
      QUALITY_VALID_STATUSES: "created,paid,shipped,delivered"
      QUALITY_FAIL_ON_VIOLATIONS: "0"
      OPENLINEAGE_NAMESPACE: ${OPENLINEAGE_NAMESPACE:-de-practicum}
      OPENLINEAGE_DISABLED: ${OPENLINEAGE_DISABLED:-}
      OPENLINEAGE__TRANSPORT__TYPE: ${OPENLINEAGE_TRANSPORT_TYPE:-file}
      OPENLINEAGE__TRANSPORT__LOG_FILE_PATH: /lineage/events.jsonl
      OPENLINEAGE__TRANSPORT__APPEND: "true"
    volumes:
      - ./iceberg:/app:ro
      - de_demo_lineage_events:/lineage
    depends_on:
      iceberg-rest:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    networks:
      - de_demo_net

  observability-exporter:
    build:
      context: ./observability
      dockerfile: Dockerfile
    image: de-practicum-demo-observability:0.22.1-h1
    container_name: de-demo-observability-exporter
    profiles: ["observability"]
    mem_limit: 128m
    environment:
      POSTGRES_HOST: de-demo-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PROMETHEUS_METRICS_PORT: "9104"
      PROMETHEUS_EXPORTER_POLL_SECONDS: "15"
      OTEL_ENABLED: ${OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_TIMEOUT: ${OTEL_EXPORTER_OTLP_TIMEOUT:-5}
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-de-practicum}
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-local}
    ports:
      - "${OBSERVABILITY_EXPORTER_HOST_PORT:-19104}:9104"
    depends_on:
      de-demo-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9104/metrics')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - de_demo_net

  prometheus:
    image: ${PROMETHEUS_IMAGE:?PROMETHEUS_IMAGE is required}
    container_name: de-demo-prometheus
    profiles: ["observability"]
    mem_limit: 256m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --enable-feature=exemplar-storage
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_HOST_PORT:-19090}:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - de_demo_prometheus_data:/prometheus
    depends_on:
      observability-exporter:
        condition: service_healthy
      iceberg-writer:
        condition: service_started
      iceberg-medallion:
        condition: service_started
      orders-streaming:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9090/-/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks:
      - de_demo_net

  otel-collector:
    profiles: ["otel"]
    image: ${OTEL_COLLECTOR_IMAGE:?OTEL_COLLECTOR_IMAGE is required when the otel profile is enabled}
    container_name: de-demo-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - de_demo_otel_storage:/var/lib/otelcol
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks:
      - de_demo_net

  tempo-minio:
    profiles: ["observability-next"]
    image: ${TEMPO_MINIO_IMAGE:?TEMPO_MINIO_IMAGE is required for the Tempo profile}
    container_name: de-demo-tempo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${TEMPO_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${TEMPO_S3_SECRET_KEY}
    volumes:
      - de_demo_tempo_minio_data:/data
    networks:
      - de_demo_net

  tempo-minio-init:
    profiles: ["observability-next"]
    image: ${TEMPO_MINIO_MC_IMAGE:?TEMPO_MINIO_MC_IMAGE is required for the Tempo profile}
    container_name: de-demo-tempo-minio-init
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set tempo http://tempo-minio:9000
        "$${TEMPO_S3_ACCESS_KEY}" "$${TEMPO_S3_SECRET_KEY}"; do sleep 1; done;
        mc mb --ignore-existing "tempo/$${TEMPO_S3_BUCKET}";
        mc ilm rule add --expire-days 2 --prefix "$${TEMPO_S3_PREFIX}"
        "tempo/$${TEMPO_S3_BUCKET}";
    environment:
      TEMPO_S3_ACCESS_KEY: ${TEMPO_S3_ACCESS_KEY}
      TEMPO_S3_SECRET_KEY: ${TEMPO_S3_SECRET_KEY}
      TEMPO_S3_BUCKET: ${TEMPO_S3_BUCKET}
      TEMPO_S3_PREFIX: ${TEMPO_S3_PREFIX}
    depends_on:
      tempo-minio:
        condition: service_started
    networks:
      - de_demo_net

  tempo:
    profiles: ["observability-next"]
    image: ${TEMPO_IMAGE:?TEMPO_IMAGE is required for the Tempo profile}
    container_name: de-demo-tempo
    command:
      - -config.file=/etc/tempo/tempo.yaml
      - -config.expand-env=true
      - -target=all
    environment:
      TEMPO_S3_ENDPOINT: tempo-minio:9000
      TEMPO_S3_BUCKET: ${TEMPO_S3_BUCKET}
      TEMPO_S3_PREFIX: ${TEMPO_S3_PREFIX}
      TEMPO_S3_ACCESS_KEY: ${TEMPO_S3_ACCESS_KEY}
      TEMPO_S3_SECRET_KEY: ${TEMPO_S3_SECRET_KEY}
    ports:
      - "${TEMPO_HOST_PORT:-13200}:3200"
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - de_demo_tempo_data:/var/tempo
    depends_on:
      tempo-minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    networks:
      - de_demo_net

  grafana:
    image: ${GRAFANA_IMAGE:?GRAFANA_IMAGE is required}
    container_name: de-demo-grafana
    profiles: ["observability"]
    mem_limit: 384m
    ports:
      - "${GRAFANA_HOST_PORT:-13001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - de_demo_grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - de_demo_net

  trino:
    image: ${TRINO_IMAGE:?TRINO_IMAGE is required}
    container_name: de-demo-trino
    hostname: trino
    mem_limit: 1536m
    user: "0:0"
    command:
      - bash
      - /etc/trino/start-trino.sh
    environment:
      TRINO_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      TRINO_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${TRINO_HOST_PORT}:8080"
    volumes:
      - ./trino/etc:/etc/trino
    # The image health-check parses config.properties textually and can retain
    # a CR from a Windows checkout in the port value. Keep the readiness probe
    # independent of repository line endings.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/v1/info | grep -q '\"starting\":false'"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      iceberg-rest:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    networks:
      - de_demo_net

  metabase:
    image: ${METABASE_IMAGE:?METABASE_IMAGE is required}
    container_name: de-demo-metabase
    profiles: ["bi"]
    mem_limit: 1280m
    ports:
      - "${METABASE_HOST_PORT}:3000"
    volumes:
      - de_demo_metabase_data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m"
    networks:
      - de_demo_net

  orders-producer:
    build:
      context: ./kafka/producer
      dockerfile: Dockerfile
    image: de-practicum-demo-orders-producer:0.1.0
    container_name: de-demo-orders-producer
    mem_limit: 128m
    logging: *bounded-logging
    working_dir: /app
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: orders
      EVENTS_PER_SECOND: "2"
    volumes:
      - ./kafka/producer:/app:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - de_demo_net

  orders-streaming:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: de-practicum-demo-spark:4.2.0-h1
    container_name: de-demo-orders-streaming
    mem_limit: 1280m
    logging: *bounded-logging
    hostname: orders-streaming

    command:
      - bash
      - -lc
      - |
        exec /usr/local/bin/spark-submit-h1 \
          --master spark://spark-master:7077 \
          --conf spark.driver.host=orders-streaming \
          --conf spark.driver.bindAddress=0.0.0.0 \
          --conf spark.driver.port=17080 \
          --conf spark.blockManager.port=17081 \
          --conf spark.driver.memory=512m \
          --conf spark.executor.cores=1 \
          --conf spark.executor.memory=1g \
          --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000 \
          --conf spark.hadoop.fs.s3a.path.style.access=true \
          --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false \
          --conf spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider \
          /opt/spark/jobs/orders_streaming.py

    environment:
      HOME: /tmp/spark-home
      PYSPARK_PYTHON: /usr/bin/python3

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: orders
      KAFKA_FAIL_ON_DATA_LOSS: ${KAFKA_FAIL_ON_DATA_LOSS:-true}
      # New-baseline lineage/checkpoint overrides are opt-in.  The existing
      # RAW_CHECKPOINT_PATH, POSTGRES_CHECKPOINT_PATH, DEAD_LETTER_CHECKPOINT_PATH,
      # and RECONCILIATION_CHECKPOINT_PATH defaults remain in the Spark job
      # untouched; these names are consumed only for a deliberate new epoch.
      SOURCE_EPOCH_ID: ${SOURCE_EPOCH_ID:-}
      NEW_BASELINE_CHECKPOINT_ROOT: ${NEW_BASELINE_CHECKPOINT_ROOT:-s3a://de-practicum/checkpoints/b2-new-baseline/}
      NEW_BASELINE_RAW_CHECKPOINT_PATH: ${NEW_BASELINE_RAW_CHECKPOINT_PATH:-}
      NEW_BASELINE_POSTGRES_CHECKPOINT_PATH: ${NEW_BASELINE_POSTGRES_CHECKPOINT_PATH:-}
      NEW_BASELINE_DEAD_LETTER_CHECKPOINT_PATH: ${NEW_BASELINE_DEAD_LETTER_CHECKPOINT_PATH:-}
      NEW_BASELINE_RECONCILIATION_CHECKPOINT_PATH: ${NEW_BASELINE_RECONCILIATION_CHECKPOINT_PATH:-}

      POSTGRES_HOST: de-demo-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: de-practicum
      DEAD_LETTER_OUTPUT_PATH: s3a://de-practicum/streaming/orders_dead_letter
      DEAD_LETTER_CHECKPOINT_PATH: s3a://de-practicum/checkpoints/orders_dead_letter
      RECONCILIATION_OUTPUT_PATH: s3a://de-practicum/streaming/orders_reconciliation
      RECONCILIATION_CHECKPOINT_PATH: s3a://de-practicum/checkpoints/orders_reconciliation
      PROMETHEUS_METRICS_PORT: "9103"

    volumes:
      - ./spark/jobs:/opt/spark/jobs:ro

    depends_on:
      kafka:
        condition: service_healthy
      de-demo-postgres:
        condition: service_healthy
      minio:
        condition: service_started
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started

    # Bounded, not unlimited. This job is deliberately fail-closed on unavailable
    # Kafka history, so `unless-stopped` turned a permanent, deterministic failure
    # into an infinite resubmission loop that filled the Docker disk.
    restart: on-failure:3

    networks:
      - de_demo_net

  superset:
    image: ${SUPERSET_IMAGE:?SUPERSET_IMAGE is required}
    container_name: de-demo-superset
    profiles: ["bi"]
    mem_limit: 512m
    ports:
      - "18088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_HOME: /app/superset_home
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    depends_on:
      de-demo-postgres:
        condition: service_healthy
    networks:
      - de_demo_net
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - de_demo_superset_home:/app/superset_home

  superset-mcp:
    image: ${SUPERSET_IMAGE:?SUPERSET_IMAGE is required}
    container_name: de-demo-superset-mcp
    profiles: ["bi"]
    mem_limit: 512m

    command:
      - superset
      - mcp
      - run
      - --host
      - 0.0.0.0
      - --port
      - "5008"

    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_HOME: /app/superset_home

    ports:
      - "15008:5008"

    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - de_demo_superset_home:/app/superset_home

    depends_on:
      superset:
        condition: service_started
      de-demo-postgres:
        condition: service_healthy

    restart: unless-stopped
    
    networks:
      - de_demo_net

volumes:
  de_demo_kafka_data:
    # Keep the broker volume identity independent of the Compose project name.
    name: de_demo_kafka_data
  de_demo_minio_data:
  de_demo_metabase_data:
  de_demo_superset_home:
  de_demo_iceberg_catalog:
  # Explicit name: Airflow declares this volume from docker-compose.yml,
  # which CI starts without this file. Both must resolve to one volume or
  # the lineage receipt sees only half the emitted events.
  de_demo_lineage_events:
    name: de_demo_lineage_events
  de_demo_iceberg_writer_state:
  # Explicit name: the E2E test mounts this by name from a plain `docker run`,
  # so it must not carry the Compose project-name prefix.
  de_demo_prometheus_data:
  de_demo_grafana_data:
  de_demo_otel_storage:
  de_demo_tempo_data:
  de_demo_tempo_minio_data:

networks:
  de_demo_net:
    external: true
    name: de_demo_net

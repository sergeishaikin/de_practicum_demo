[project]
name = "de-practicum-demo"
version = "0.1.0"
description = "Local data-engineering practicum stack"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "black==25.9.0",
    "mypy==1.18.2",
    "prometheus-client==0.22.1",
    "psycopg2-binary==2.9.12",
    "pyarrow==21.0.0",
    "pyiceberg==0.11.1",
    "pyiceberg-core==0.7.0",
    "pytest==8.4.2",
    "pytest-bdd==8.1.0",
    "pytest-cov==7.1.0",
    "ruff==0.12.0",
    "sqlfluff==3.4.2",
    "types-psycopg2==2.9.21.20250915",
]

[tool.uv]
package = false
required-version = "==0.12.5"

[tool.black]
target-version = ["py312"]
extend-exclude = "^/\\.architecture-audit/"

[tool.mypy]
# Typed scope is explicit and expands monotonically. `iceberg/` is the production
# core the coverage gate already guards; every module in it already carries
# `from __future__ import annotations`. Other first-party surfaces - dags/,
# scripts/, spark/, kafka/, observability/ - are onboarded by their own changes.
python_version = "3.12"
files = ["iceberg"]

# `iceberg/` is a sys.path root, not a package: tests/conftest.py puts it on the
# path so modules import as `writer.iceberg_writer`, `medallion.iceberg_medallion`
# and `common.ops`. Without these two settings mypy resolves `common/ops.py` under
# two module names and refuses to check anything.
mypy_path = "iceberg"
explicit_package_bases = true
namespace_packages = true

warn_unused_configs = true
warn_redundant_casts = true
# A suppression that stops being needed is itself an error, so `type: ignore`
# cannot quietly outlive the problem it was added for.
warn_unused_ignores = true
no_implicit_optional = true

# Third-party packages that ship no `py.typed` marker, enumerated rather than
# blanket-ignored. psycopg2 is deliberately absent: `types-psycopg2` provides
# real stubs, which NG-0.9 prefers over a suppression.
[[tool.mypy.overrides]]
module = ["pyarrow.*", "pyiceberg.*", "prometheus_client.*"]
ignore_missing_imports = true

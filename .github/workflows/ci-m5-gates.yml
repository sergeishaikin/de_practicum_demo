name: M5 architecture gates

on:
  pull_request:
    paths:
      - "iceberg/**"
      - "tests/test_*.py"
      - "tests/features/**"
      - "tests/support/**"
      - "tests/integration/test_m3_b2_recovery.py"
      - "tests/integration/test_m4_gold_cutover.py"
      - "docker-compose.yml"
      - "docker-compose.extended.yml"
      - ".github/workflows/ci-m5-gates.yml"
  workflow_dispatch:

jobs:
  live-m5:
    name: PR M3/M4 recovery and cutover gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dev dependencies
        run: uv sync --locked
      - name: Prepare runtime env
        run: |
          cp .env.example .env
          sed -i 's/^MINIO_ROOT_PASSWORD=.*/MINIO_ROOT_PASSWORD=minio123/' .env
      - name: Start minimal Iceberg stack
        run: |
          # The merged project takes `external: true` from the extended file,
          # so compose will not create de_demo_net itself. scripts/stack-up.ps1
          # pre-creates it for exactly this reason.
          docker network create de_demo_net || true
          docker compose --env-file .env -f docker-compose.yml -f docker-compose.extended.yml up -d minio iceberg-rest
          for i in $(seq 1 36); do
            if curl -fsS http://localhost:18181/v1/config >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          curl -fsS http://localhost:18181/v1/config >/dev/null
          docker exec de-demo-minio mc alias set local http://localhost:9000 minio minio123
          docker exec de-demo-minio mc mb --ignore-existing local/de-practicum
      - name: M5 PR blocking live gates
        run: >
          uv run --locked pytest -q -m integration
          tests/integration/test_m3_b2_recovery.py
          tests/integration/test_m4_gold_cutover.py
      - name: PR blocking BDD specifications
        run: uv run --locked pytest -q tests/features -m "bdd and integration"
      - name: Capture progress-read corruption evidence
        # Written by tests/support/progress_read_diagnostics.py at the moment a
        # progress object fails to parse. The undecoded bytes are the evidence,
        # so they are uploaded as-is rather than summarised. Read-only, and
        # `if: failure()` so it costs nothing on a green run.
        if: failure()
        run: |
          ls -laR artifacts/read-corruption || echo "no capture directory: the failure was not a corrupted read"
      - name: Upload progress-read corruption evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m5-read-corruption
          path: artifacts/read-corruption/**
          if-no-files-found: ignore
      - name: Cleanup
        if: always()
        run: >
          docker compose --env-file .env
          -f docker-compose.yml
          -f docker-compose.extended.yml
          down --remove-orphans || true

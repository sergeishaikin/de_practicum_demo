name: M5 architecture gates

on:
  pull_request:
    paths:
      - "iceberg/**"
      - "tests/test_*.py"
      - "tests/integration/test_crash_recovery.py"
      - "tests/integration/test_m3_b2_recovery.py"
      - "tests/integration/test_m4_gold_cutover.py"
      - "docker-compose.extended.yml"
      - ".github/workflows/ci-m5-gates.yml"
  workflow_dispatch:

jobs:
  live-m5:
    name: PR M3/M4 recovery and cutover gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare runtime env
        run: |
          cp .env.example .env
          sed -i 's/^MINIO_ROOT_PASSWORD=.*/MINIO_ROOT_PASSWORD=minio123/' .env
      - name: Start minimal Iceberg stack
        run: |
          docker network create de_demo_net || true
          docker compose --env-file .env -f docker-compose.extended.yml up -d minio iceberg-rest
          for i in $(seq 1 36); do
            if curl -fsS http://localhost:18181/v1/config >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          curl -fsS http://localhost:18181/v1/config >/dev/null
          docker exec de-demo-minio mc alias set local http://localhost:9000 minio minio123
          docker exec de-demo-minio mc mb --ignore-existing local/de-practicum
      - name: M5 PR blocking live gates
        run: >
          python -m pytest -q -m integration
          tests/integration/test_crash_recovery.py
          tests/integration/test_m3_b2_recovery.py
          tests/integration/test_m4_gold_cutover.py
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.extended.yml down --remove-orphans || true

name: H1 clean reproducible stack

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".env.example"
      - "docker-compose*.yml"
      - "*.Dockerfile"
      - "spark/**"
      - "iceberg/**"
      - "observability/**"
      - "kafka/producer/**"
      - "jupyter/**"
      - "superset/**"
      - "dbt/**"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - "airflow.requirements.*"
      - "airflow.constraints.txt"
      - "requirements-dev.txt"
      - "scripts/bootstrap_stack.py"
      - "scripts/validate_runtime_config.py"
      - "docs/runtime/**"
      - "tests/test_h1_runtime.py"

jobs:
  clean-stack:
    name: Fresh volumes, baked runtime, full verification
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            dbt/requirements.txt
      - name: Install host verification dependencies
        run: uv sync --locked
      - name: Create clean deployment configuration
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=h1-postgres-secret/' .env
          sed -i 's/^MINIO_ROOT_PASSWORD=.*/MINIO_ROOT_PASSWORD=h1-minio-secret/' .env
          sed -i 's/^SUPERSET_SECRET_KEY=.*/SUPERSET_SECRET_KEY=h1-superset-secret/' .env
          sed -i 's/^AIRFLOW_API_SECRET_KEY=.*/AIRFLOW_API_SECRET_KEY=h1-airflow-api-secret/' .env
          sed -i 's/^AIRFLOW_JWT_SECRET=.*/AIRFLOW_JWT_SECRET=h1-airflow-jwt-secret/' .env
          sed -i 's/^GRAFANA_ADMIN_PASSWORD=.*/GRAFANA_ADMIN_PASSWORD=h1-grafana-secret/' .env
          sed -i 's/^AIRFLOW_DB_PASSWORD=.*/AIRFLOW_DB_PASSWORD=h1-airflow-db-secret/' .env
      - name: Validate configuration and Compose graph
        run: |
          uv run --locked python scripts/validate_runtime_config.py --env-file .env --profile clean
          docker network create de_demo_net || true
          docker compose --env-file .env -f docker-compose.yml -f docker-compose.extended.yml config >/tmp/h1-compose.yml
      - name: Export clean runtime configuration for host checks
        run: |
          set -a
          source .env
          set +a
          {
            echo "ICEBERG_CATALOG_URI=http://localhost:${ICEBERG_REST_PORT}"
            echo "ICEBERG_WAREHOUSE=s3://de-practicum/warehouse"
            echo "S3_ENDPOINT=http://localhost:${MINIO_API_PORT}"
            echo "AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}"
            echo "AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}"
            echo "DWH_HOST=localhost"
            echo "DWH_PORT=${POSTGRES_HOST_PORT}"
            echo "DWH_DB=${POSTGRES_DB}"
            echo "DWH_USER=${POSTGRES_USER}"
            echo "DWH_PASSWORD=${POSTGRES_PASSWORD}"
            echo "DBT_TRINO_HOST=localhost"
            echo "DBT_TRINO_PORT=${TRINO_HOST_PORT}"
          } >> "$GITHUB_ENV"
      - name: Ensure fresh state
        run: docker compose --env-file .env -f docker-compose.yml -f docker-compose.extended.yml down --volumes --remove-orphans
      - name: Build and start clean stack
        run: docker compose --env-file .env -f docker-compose.yml -f docker-compose.extended.yml up -d --build --pull always
      - name: Bootstrap and wait for dependencies
        run: uv run --locked python scripts/bootstrap_stack.py --env-file .env --timeout 900
      - name: Integration suite
        run: uv run --locked pytest tests/integration -m integration
      - name: Quiesce background Iceberg writers
        run: |
          docker compose --env-file .env -f docker-compose.yml -f docker-compose.extended.yml \
            stop iceberg-writer iceberg-medallion
      - name: Deterministic E2E
        run: uv run --locked pytest tests/e2e -m e2e
      - name: Capture cold-start E2E diagnostics
        # Only on failure, and before `Destroy clean stack` deletes the volumes.
        # The R1 test removes its own streaming container and `Collect logs`
        # reads compose services only, so the state that explains a cold-start
        # E2E failure is gone before anyone can look. Every command here is a
        # read and is `|| true`, so this step can never change the run outcome.
        if: failure()
        run: |
          mkdir -p h1-r1-diagnostics
          MC='docker exec de-demo-minio mc'
          KAFKA='docker exec de-demo-kafka'
          # Decisive fact: did the first streaming process commit an offset before
          # it was removed? `commits/` under a run's raw checkpoint is what "there
          # was an offset to lose" means. Object timestamps are kept because they
          # are the only cold-start latency evidence available without
          # instrumenting the test itself.
          # The MinIO credentials reachable here are the ones the export step put
          # into GITHUB_ENV; MINIO_ROOT_USER/PASSWORD live only in .env.
          $MC alias set local http://localhost:9000 "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" >/dev/null 2>&1 || true
          $MC ls --recursive local/de-practicum/e2e > h1-r1-diagnostics/minio-e2e-tree.txt 2>&1 || true
          # Broker-side corroboration.
          $KAFKA /opt/kafka/bin/kafka-consumer-groups.sh --bootstrap-server localhost:9092 --all-groups --describe > h1-r1-diagnostics/kafka-consumer-groups.txt 2>&1 || true
          $KAFKA /opt/kafka/bin/kafka-get-offsets.sh --bootstrap-server localhost:9092 > h1-r1-diagnostics/kafka-offsets.txt 2>&1 || true
          # Any ad-hoc streaming container the test left behind, with its log.
          docker ps -a --filter name=e2e-streaming- --format '{{.Names}} {{.Status}} {{.CreatedAt}}' > h1-r1-diagnostics/e2e-streaming-containers.txt 2>&1 || true
          for c in $(docker ps -aq --filter name=e2e-streaming-); do
            docker logs "$c" > "h1-r1-diagnostics/$c.log" 2>&1 || true
          done
      - name: Probe dbt directory ownership
        # Unconditional and read-only. The step after this one fails on a clean
        # runner with `cp: cannot create regular file 'profiles.yml': Permission
        # denied`, and ownership of the checkout at this instant is the fact that
        # says who mutated it. Not `if: failure()`: a capture that only runs after
        # a failure collects nothing when the run fails elsewhere, and nothing at
        # all when it passes. Every command is `|| true`.
        if: always()
        run: |
          mkdir -p h1-dbt-probe
          {
            echo '## runner identity'
            id || true
            echo '## workspace and dbt directory'
            ls -ld . || true
            ls -ld dbt || true
            ls -la dbt || true
            stat dbt || true
            echo '## the file the next step tries to create'
            stat dbt/profiles.yml || echo 'dbt/profiles.yml: absent'
            stat dbt/profiles.yml.example || true
            echo '## owner and mode of every entry directly under dbt/'
            find dbt -maxdepth 1 -exec ls -ld {} + || true
            echo '## same question for the warehouse project'
            stat dbt/warehouse/profiles.yml || echo 'dbt/warehouse/profiles.yml: absent'
          } > h1-dbt-probe/ownership.txt 2>&1 || true
          # Attribute the mutation to a named service rather than inferring it:
          # which services mount dbt/, under which user, with which effective mounts.
          # The rendered config carries every secret from .env, so it stays in
          # /tmp and never reaches the artifact. Only mount lines are extracted,
          # and anything that looks like a credential is dropped.
          docker compose --env-file .env -f docker-compose.yml -f docker-compose.extended.yml config > /tmp/h1-compose-effective.yml 2>&1 || true
          grep -n 'dbt' /tmp/h1-compose-effective.yml | grep -viE 'password|secret|key|token' > h1-dbt-probe/compose-dbt-mounts.txt 2>&1 || true
          docker inspect de-demo-airflow --format '{{json .Mounts}}' > h1-dbt-probe/airflow-mounts.json 2>&1 || true
          docker inspect de-demo-airflow --format 'User={{.Config.User}}' > h1-dbt-probe/airflow-user.txt 2>&1 || true
          docker exec de-demo-airflow id > h1-dbt-probe/airflow-container-id.txt 2>&1 || true
      - name: dbt semantic contract
        working-directory: dbt
        run: |
          uv venv --python 3.12 ../.venv-dbt
          uv pip sync --python ../.venv-dbt/bin/python --require-hashes requirements.txt
          cp profiles.yml.example profiles.yml
          ../.venv-dbt/bin/dbt parse --profiles-dir .
          ../.venv-dbt/bin/dbt compile --profiles-dir .
          ../.venv-dbt/bin/dbt run --profiles-dir . --select semantic --threads 1
          ../.venv-dbt/bin/dbt test --profiles-dir . 2>&1 | tee /tmp/h1-dbt-test.log
          # 26 data tests plus the 2 semantic unit tests. The total is pinned on
          # purpose - it catches tests silently disappearing, which ERROR=0 alone
          # would not - so it has to be updated when the project gains tests.
          grep -Eq 'PASS=28 .*ERROR=0 .*TOTAL=28' /tmp/h1-dbt-test.log
          ../.venv-dbt/bin/dbt docs generate --profiles-dir .
      - name: Prometheus and Grafana smoke
        run: |
          curl -fsS http://localhost:19090/-/ready
          curl -fsS http://localhost:19090/api/v1/targets | grep -q '"health":"up"'
          curl -fsS http://localhost:13001/api/health | grep -q '"database":"ok"'
      - name: Capture observability smoke diagnostics
        # The smoke step pipes into grep, so a failure says only that one of its
        # three assertions did not hold - not which, and not why. Every command
        # here is a read with `|| true`, run before the stack is destroyed.
        if: failure()
        run: |
          mkdir -p h1-smoke-diagnostics
          D=h1-smoke-diagnostics
          # Status codes go to one file so a curl failure is distinguishable from
          # a body that simply does not match what the smoke step greps for.
          echo "ready=$(curl -sS -o $D/prometheus-ready.txt -w '%{http_code}' http://localhost:19090/-/ready)" >> $D/http-status.txt || true
          echo "targets=$(curl -sS -o $D/prometheus-targets.json -w '%{http_code}' http://localhost:19090/api/v1/targets)" >> $D/http-status.txt || true
          echo "grafana=$(curl -sS -o $D/grafana-health.json -w '%{http_code}' http://localhost:13001/api/health)" >> $D/http-status.txt || true
          docker compose --env-file .env -f docker-compose.yml -f docker-compose.extended.yml ps > $D/compose-ps.txt 2>&1 || true
          docker logs de-demo-observability-exporter > h1-smoke-diagnostics/exporter.log 2>&1 || true
          docker logs de-demo-grafana > h1-smoke-diagnostics/grafana.log 2>&1 || true
      - name: Runtime version evidence
        if: always()
        run: |
          docker compose --env-file .env -f docker-compose.yml -f docker-compose.extended.yml images
          docker exec de-demo-trino trino --version || true
          docker exec de-demo-orders-streaming /usr/local/bin/spark-submit-h1 --version || true
          .venv-dbt/bin/dbt --version || true
      - name: Collect logs
        if: failure()
        run: docker compose --env-file .env -f docker-compose.yml -f docker-compose.extended.yml logs --no-color > h1-clean-stack.log || true
      - name: Upload logs and dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h1-clean-stack-evidence
          path: |
            h1-clean-stack.log
            h1-r1-diagnostics/**
            h1-dbt-probe/**
            h1-smoke-diagnostics/**
            dbt/target/**
      - name: Destroy clean stack
        if: always()
        run: docker compose --env-file .env -f docker-compose.yml -f docker-compose.extended.yml down --volumes --remove-orphans

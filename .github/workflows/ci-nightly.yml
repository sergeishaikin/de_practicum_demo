name: Nightly lakehouse

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

jobs:
  nightly:
    name: Full stack + E2E + maintenance DAG
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare runtime env (minio creds must match test defaults)
        run: |
          cp .env.example .env
          sed -i 's/^MINIO_ROOT_PASSWORD=.*/MINIO_ROOT_PASSWORD=minio123/' .env
          printf 'SUPERSET_SECRET_KEY=nightly-secret\n' >> .env
      - name: Build and start full stack
        run: docker compose --env-file .env -f docker-compose.yml -f docker-compose.extended.yml up -d --build
      - name: Ensure warehouse bucket
        run: |
          for i in $(seq 1 24); do
            if docker exec de-demo-minio mc alias set local http://localhost:9000 minio minio123 >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          docker exec de-demo-minio mc mb --ignore-existing local/de-practicum
      - name: Wait for core services
        run: |
          for i in $(seq 1 90); do
            ok=1
            curl -fsS http://localhost:18181/v1/config >/dev/null 2>&1 || ok=0
            docker exec de-demo-trino trino --execute "SELECT 1" >/dev/null 2>&1 || ok=0
            docker exec de-demo-kafka kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || ok=0
            if [ "$ok" = "1" ]; then echo "stack ready"; exit 0; fi
            sleep 10
          done
          echo "stack did not become ready"
          docker compose -f docker-compose.extended.yml logs --no-color || true
          exit 1
      - name: Integration layer
        run: python -m pytest tests/integration -m integration
      - name: Deterministic Kafka/Spark E2E (lands with its own todo)
        run: |
          if [ -d tests/e2e ]; then
            python -m pytest tests/e2e -m e2e
          else
            echo "tests/e2e not present yet - skipping"
          fi
      - name: Maintenance DAG end-to-end
        run: python scripts/verify_maintenance_dag.py
      - name: Collect logs
        if: always()
        run: |
          docker compose -f docker-compose.extended.yml logs --no-color > stack-logs.txt || true
          docker compose logs --no-color > base-logs.txt || true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-stack-logs
          path: |
            stack-logs.txt
            base-logs.txt
      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.extended.yml down --remove-orphans || true
          docker compose down --remove-orphans || true

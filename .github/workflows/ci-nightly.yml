name: Nightly lakehouse

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

jobs:
  nightly:
    name: Full stack + E2E + maintenance DAG
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dev dependencies
        run: uv sync --locked
      - name: Prepare runtime env (minio + postgres creds must match test defaults)
        run: |
          cp .env.example .env
          sed -i 's/^MINIO_ROOT_PASSWORD=.*/MINIO_ROOT_PASSWORD=minio123/' .env
          # .env.example ships POSTGRES_PASSWORD=change-me, but the test suites
          # default to app/app (tests/e2e PG dict, tests/integration). Without
          # this the E2E preflight dies with "password authentication failed".
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=app/' .env
          # Leading newline: never let this concatenate onto an unterminated
          # last line (that produced `TRINO_HOST_PORT=18082SUPERSET_SECRET_KEY=...`
          # and a compose "invalid hostPort" failure).
          printf '\nSUPERSET_SECRET_KEY=nightly-secret\n' >> .env
      - name: Create shared network
        # The merged config resolves de_demo_net to external: true (the
        # extended file's declaration wins), so nothing creates it on a fresh
        # runner. ci-integration.yml does the same.
        run: docker network create de_demo_net || true
      - name: Build and start full stack
        run: docker compose --env-file .env -f docker-compose.yml -f docker-compose.extended.yml up -d --build
      - name: Ensure warehouse bucket
        run: |
          for i in $(seq 1 24); do
            if docker exec de-demo-minio mc alias set local http://localhost:9000 minio minio123 >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          docker exec de-demo-minio mc mb --ignore-existing local/de-practicum
      - name: Wait for core services
        run: |
          for i in $(seq 1 90); do
            pending=""
            curl -fsS http://localhost:18181/v1/config >/dev/null 2>&1 || pending="$pending iceberg-rest"
            docker exec de-demo-trino trino --execute "SELECT 1" >/dev/null 2>&1 || pending="$pending trino"
            # Full path: the Kafka scripts are NOT on $PATH in this image, so a
            # bare `kafka-topics.sh` can never succeed and the loop would always
            # burn its full 15 minutes. Matches tests/e2e/test_lakehouse_e2e.py.
            docker exec de-demo-kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || pending="$pending kafka"
            if [ -z "$pending" ]; then echo "stack ready after $((i * 10))s"; exit 0; fi
            echo "attempt $i/90 — still waiting for:$pending"
            sleep 10
          done
          echo "stack did not become ready; outstanding:$pending"
          docker compose -f docker-compose.extended.yml logs --no-color || true
          exit 1
      - name: Integration layer
        run: uv run --locked pytest tests/integration -m integration
      - name: Deterministic Kafka/Spark E2E
        run: |
          if [ -d tests/e2e ]; then
            uv run --locked pytest tests/e2e -m e2e
          else
            echo "tests/e2e not present yet - skipping"
          fi
      - name: Maintenance DAG end-to-end
        run: uv run --locked python scripts/verify_maintenance_dag.py
      - name: Collect logs
        if: always()
        run: |
          docker compose -f docker-compose.extended.yml logs --no-color > stack-logs.txt || true
          docker compose logs --no-color > base-logs.txt || true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-stack-logs
          path: |
            stack-logs.txt
            base-logs.txt
            artifacts/e2e-logs/**
      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.extended.yml down --remove-orphans || true
          docker compose down --remove-orphans || true

name: Integration (live Iceberg/Trino stack)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  integration:
    name: Live integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dev dependencies
        run: uv sync --locked
      - name: Prepare runtime env (minio creds must match test defaults)
        run: |
          cp .env.example .env
          sed -i 's/^MINIO_ROOT_PASSWORD=.*/MINIO_ROOT_PASSWORD=minio123/' .env
      - name: Start base stack (creates network, postgres)
        run: docker compose --env-file .env up -d de-demo-postgres
      - name: Start live services only (minio + iceberg-rest + trino)
        run: docker compose --env-file .env -f docker-compose.yml -f docker-compose.extended.yml up -d minio iceberg-rest trino
      - name: Ensure warehouse bucket
        run: |
          for i in $(seq 1 24); do
            if docker exec de-demo-minio mc alias set local http://localhost:9000 minio minio123 >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          docker exec de-demo-minio mc mb --ignore-existing local/de-practicum
      - name: Wait for stack readiness
        run: |
          for i in $(seq 1 72); do
            ok=1
            curl -fsS http://localhost:18181/v1/config >/dev/null 2>&1 || ok=0
            docker exec de-demo-trino trino --execute "SELECT 1" >/dev/null 2>&1 || ok=0
            if [ "$ok" = "1" ]; then echo "stack ready"; exit 0; fi
            sleep 5
          done
          echo "stack did not become ready"
          docker compose --env-file .env -f docker-compose.yml -f docker-compose.extended.yml logs --no-color trino iceberg-rest minio || true
          exit 1
      - name: Integration tests
        run: uv run --locked pytest tests/integration -m integration
      - name: Integration BDD specifications
        run: uv run --locked pytest tests/features -m "bdd and integration"
      - name: Collect stack logs on failure
        if: failure()
        run: docker compose --env-file .env -f docker-compose.yml -f docker-compose.extended.yml logs --no-color > stack-logs.txt || true
      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-stack-logs
          path: stack-logs.txt
      - name: Cleanup
        if: always()
        run: |
          docker compose --env-file .env -f docker-compose.yml -f docker-compose.extended.yml down --remove-orphans || true
          docker compose --env-file .env down --remove-orphans || true

  warehouse-airflow-dbt-e2e:
    name: Warehouse Asset → Cosmos dbt E2E
    runs-on: ubuntu-latest
    env:
      AIRFLOW_IMAGE_TAG: de-practicum-demo-airflow:0.1.0
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Airflow image
        run: |
          docker buildx build --file airflow.Dockerfile --tag "$AIRFLOW_IMAGE_TAG" --load .
      - name: Prepare runtime environment
        run: cp .env.example .env
      - name: Start PostgreSQL and Airflow
        run: |
          docker compose --env-file .env up -d de-demo-postgres de-demo-airflow
          ready=0
          for i in $(seq 1 72); do
            if docker exec de-demo-airflow python -c '
          import json
          import urllib.request
          health = json.load(urllib.request.urlopen("http://127.0.0.1:8080/api/v2/monitor/health", timeout=3))
          assert health["scheduler"]["status"] == "healthy"
          assert health["dag_processor"]["status"] == "healthy"
          assert health["triggerer"]["status"] == "healthy"
            ' >/dev/null 2>&1; then
              echo "airflow ready"
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = "1"
      - name: Trigger manual ingestion boundary
        run: |
          export RUN_ID="phase03b-ci-${GITHUB_RUN_ID}"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          test "$(docker exec de-demo-airflow airflow dags list-import-errors -l -o json)" = "[]"
          docker exec de-demo-airflow airflow dags trigger warehouse_orders_ingestion --run-id "$RUN_ID"
      - name: Wait for ingestion and Asset-triggered dbt workflow
        run: |
          docker exec -e RUN_ID="$RUN_ID" de-demo-postgres sh -c '
            for i in $(seq 1 180); do
              ingestion_state=$(psql -U airflow -d airflow_meta -Atc "select coalesce((select state from dag_run where dag_id = '''warehouse_orders_ingestion''' and run_id = '''$RUN_ID''' limit 1), '''missing''')")
              echo "ingestion_state=$ingestion_state"
              if [ "$ingestion_state" = "failed" ]; then exit 1; fi
              if [ "$ingestion_state" = "success" ]; then break; fi
              sleep 5
            done
            test "$ingestion_state" = "success"
            for i in $(seq 1 240); do
              dbt_state=$(psql -U airflow -d airflow_meta -Atc "select coalesce((select state from dag_run where dag_id = '''warehouse_marts_validation''' and run_id like '''asset_triggered__%''' order by start_date desc limit 1), '''missing''')")
              echo "dbt_state=$dbt_state"
              if [ "$dbt_state" = "failed" ]; then exit 1; fi
              if [ "$dbt_state" = "success" ]; then break; fi
              sleep 5
            done
            test "$dbt_state" = "success"
          '
      - name: Verify exact pipeline provenance and dbt artifacts
        run: |
          row=$(docker exec de-demo-postgres psql -U app -d dwh -Atc "select ingestion_run_id || '|' || status || '|' || stg_orders || '|' || stg_order_items || '|' || core_order_items || '|' || mart_sales_days || '|' || duplicate_grain_rows || '|' || null_key_rows || '|' || max_reconcile_diff from marts.pipeline_runs where run_id like 'asset_triggered__%' order by run_ts desc limit 1")
          test "$row" = "$RUN_ID|success|1000|1149|1149|463|0|0|0.00"
          for artifact in manifest.json run_results.json catalog.json index.html; do
            docker exec de-demo-airflow test -s "/opt/airflow/project/dbt/warehouse/target/$artifact"
          done
      - name: Collect Airflow logs on failure
        if: failure()
        run: docker compose --env-file .env logs --no-color de-demo-airflow de-demo-postgres || true
      - name: Cleanup
        if: always()
        run: docker compose --env-file .env down --remove-orphans || true

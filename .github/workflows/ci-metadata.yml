name: Metadata profile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".env.example"
      - "docker-compose.yml"
      - "docker-compose.extended.yml"
      - "docker-compose.metadata.yml"
      - "metadata/**"
      - "dbt/**"
      - "airflow.Dockerfile"
      - "tests/test_metadata*.py"
      - "docs/CATALOG*.md"
      - "docs/LINEAGE.md"
      - ".github/workflows/ci-metadata.yml"

permissions:
  contents: read

concurrency:
  group: metadata-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata-profile:
    name: Isolated metadata profile acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install host contract dependencies
        run: uv sync --locked

      - name: Prepare isolated CI credentials
        run: |
          cp .env.example .env
          sed -i \
            -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=metadata-ci-postgres/' \
            -e 's/^MINIO_ROOT_PASSWORD=.*/MINIO_ROOT_PASSWORD=metadata-ci-minio/' \
            -e 's/^AIRFLOW_DB_PASSWORD=.*/AIRFLOW_DB_PASSWORD=metadata-ci-airflow-db/' \
            -e 's/^AIRFLOW_API_SECRET_KEY=.*/AIRFLOW_API_SECRET_KEY=metadata-ci-airflow-api/' \
            -e 's/^AIRFLOW_JWT_SECRET=.*/AIRFLOW_JWT_SECRET=metadata-ci-airflow-jwt/' \
            -e 's/^GRAFANA_ADMIN_PASSWORD=.*/GRAFANA_ADMIN_PASSWORD=metadata-ci-grafana/' \
            -e 's/^SUPERSET_SECRET_KEY=.*/SUPERSET_SECRET_KEY=metadata-ci-superset/' \
            -e 's/^METADATA_DB_PASSWORD=.*/METADATA_DB_PASSWORD=metadata-ci-db/' \
            -e 's/^METADATA_POSTGRES_SUPERUSER_PASSWORD=.*/METADATA_POSTGRES_SUPERUSER_PASSWORD=metadata-ci-postgres-admin/' \
            -e 's/^METADATA_ADMIN_PASSWORD=.*/METADATA_ADMIN_PASSWORD=admin/' \
            -e 's/^METADATA_AIRFLOW_PASSWORD=.*/METADATA_AIRFLOW_PASSWORD=metadata-ci-airflow-reader/' \
            -e 's/^METADATA_SOURCE_READER_PASSWORD=.*/METADATA_SOURCE_READER_PASSWORD=metadata-ci-source-reader/' \
            .env

      - name: Metadata contract tests
        run: uv run --locked pytest -q tests/test_metadata_contract.py tests/test_metadata_container_adapter.py

      - name: Validate merged profile configuration
        run: |
          docker network create de_demo_net || true
          docker compose --env-file .env \
            -f docker-compose.yml \
            -f docker-compose.extended.yml \
            -f docker-compose.metadata.yml \
            --profile metadata config --quiet

      - name: Start core dependencies only
        run: |
          docker compose --env-file .env \
            -f docker-compose.yml \
            -f docker-compose.extended.yml \
            -f docker-compose.metadata.yml \
            --profile metadata up -d --build \
            minio kafka de-demo-postgres iceberg-rest trino de-demo-airflow

      - name: Wait for core metadata sources
        run: |
          for i in $(seq 1 120); do
            ready=1
            curl -fsS http://localhost:18181/v1/config >/dev/null 2>&1 || ready=0
            curl -fsS http://localhost:18085/api/v2/monitor/health >/dev/null 2>&1 || ready=0
            docker exec de-demo-kafka /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || ready=0
            docker exec de-demo-trino trino --execute "SELECT 1" >/dev/null 2>&1 || ready=0
            if [ "$ready" = "1" ]; then break; fi
            sleep 5
          done
          test "$ready" = "1"

      - name: Create isolated Iceberg catalog fixture
        run: |
          docker exec de-demo-minio mc alias set local http://localhost:9000 minio metadata-ci-minio
          docker exec de-demo-minio mc mb --ignore-existing local/de-practicum
          docker exec de-demo-kafka /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 --create --if-not-exists \
            --topic orders --partitions 1 --replication-factor 1
          docker exec de-demo-trino trino --execute "
            CREATE SCHEMA IF NOT EXISTS iceberg.bronze;
            CREATE SCHEMA IF NOT EXISTS iceberg.silver;
            CREATE SCHEMA IF NOT EXISTS iceberg.gold;
            CREATE TABLE IF NOT EXISTS iceberg.bronze.orders (
              order_id varchar,
              business_version bigint
            );
            CREATE TABLE IF NOT EXISTS iceberg.silver.orders_clean (
              order_id varchar, customer varchar, amount double, country varchar,
              status varchar, event_time timestamp(6), kafka_timestamp timestamp(6),
              kafka_partition integer, kafka_offset bigint, event_date date,
              business_version bigint
            );
            INSERT INTO iceberg.silver.orders_clean VALUES
              ('ci-a', 'alice', 10.0, 'DE', 'paid', TIMESTAMP '2026-01-01 10:00:00', TIMESTAMP '2026-01-01 10:00:00', 0, 1, DATE '2026-01-01', 1),
              ('ci-b', 'bob', 20.0, 'FR', 'shipped', TIMESTAMP '2026-01-01 11:00:00', TIMESTAMP '2026-01-01 11:00:00', 0, 2, DATE '2026-01-01', 2);
            CREATE TABLE IF NOT EXISTS iceberg.gold.orders_daily_metrics (
              event_date date, country varchar, status varchar, orders_count bigint,
              total_amount double, avg_amount double, distinct_customers bigint
            );
            INSERT INTO iceberg.gold.orders_daily_metrics VALUES
              (DATE '2026-01-01', 'DE', 'paid', 1, 10.0, 10.0, 1),
              (DATE '2026-01-01', 'FR', 'shipped', 1, 20.0, 20.0, 1)
          "

      - name: Start metadata profile and deterministic artifact stages
        run: |
          docker compose --env-file .env \
            -f docker-compose.yml \
            -f docker-compose.extended.yml \
            -f docker-compose.metadata.yml \
            --profile metadata up -d --build \
            metadata-postgres metadata-opensearch metadata-migrate metadata-server \
            metadata-ingestion metadata-source-reader metadata-dbt-warehouse-build \
            metadata-dbt-warehouse metadata-dbt-semantic metadata-lineage-topic
          for container in \
            de-metadata-source-reader \
            de-metadata-dbt-warehouse-build \
            de-metadata-dbt-warehouse \
            de-metadata-dbt-semantic; do
            status=$(docker wait "$container")
            test "$status" = "0" || {
              docker logs "$container" || true
              exit 1
            }
          done
          for i in $(seq 1 60); do
            if docker exec de-metadata-ingestion env PYTHONPATH=/opt/metadata/scripts python -c \
              "import bootstrap_catalog; bootstrap_catalog.login()" >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          docker exec de-metadata-ingestion env PYTHONPATH=/opt/metadata/scripts python -c \
            "import bootstrap_catalog; bootstrap_catalog.login()" >/dev/null
          docker compose --env-file .env \
            -f docker-compose.yml \
            -f docker-compose.extended.yml \
            -f docker-compose.metadata.yml \
            --profile metadata up -d \
            metadata-bootstrap metadata-static-ingestion metadata-ownership
          for container in \
            de-metadata-bootstrap \
            de-metadata-static-ingestion \
            de-metadata-ownership; do
            status=$(docker wait "$container")
            test "$status" = "0" || {
              docker logs "$container" || true
              exit 1
            }
          done

      - name: Verify metadata API bootstrap
        run: |
          curl -fsS http://localhost:18586/healthcheck >/dev/null
          docker exec -i de-metadata-ingestion python - <<'PY'
          import base64
          import json
          import os
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          api = "http://metadata-server:8585/api"
          body = json.dumps({
              "email": os.environ["METADATA_ADMIN_EMAIL"],
              "password": base64.b64encode(os.environ["METADATA_ADMIN_PASSWORD"].encode()).decode(),
          }).encode()
          with urlopen(Request(f"{api}/v1/users/login", data=body, headers={"Content-Type": "application/json"})) as response:
              token = json.load(response)["accessToken"]
          headers = {"Authorization": f"Bearer {token}"}
          for kind, name in [("domains", "orders"), ("teams", "data-platform"), ("services/databaseServices", "warehouse_postgres")]:
              request = Request(f"{api}/v1/{kind}/name/{quote(name, safe='')}", headers=headers)
              with urlopen(request) as response:
                  assert response.status == 200, (kind, name, response.status)
          print("metadata bootstrap API checks passed")
          PY

      - name: Verify the dbt staging layer reached PostgreSQL and the catalog
        run: |
          set -a
          . ./.env
          set +a
          # (1) The reader identity, not `app`. The dbt views were created after
          # create-reader.sql ran, so reaching them exercises the default
          # privileges rather than the one-off GRANT.
          privilege=$(docker exec -e PGPASSWORD="$METADATA_SOURCE_READER_PASSWORD" de-demo-postgres \
            psql -U "$METADATA_SOURCE_READER_USER" -d "$POSTGRES_DB" -At -v ON_ERROR_STOP=1 \
            -c "select has_schema_privilege(current_user, 'staging', 'USAGE')")
          test "$privilege" = "t" || { echo "metadata reader has no USAGE on staging"; exit 1; }
          for relation in stg_core__orders stg_core__order_items stg_staging__orders stg_staging__order_items; do
            docker exec -e PGPASSWORD="$METADATA_SOURCE_READER_PASSWORD" de-demo-postgres \
              psql -U "$METADATA_SOURCE_READER_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 \
              -c "select 1 from staging.$relation limit 0" >/dev/null
          done
          echo "metadata reader can read every dbt staging relation"

      - name: Verify the catalog indexed the dbt staging layer
        run: |
          docker exec -i de-metadata-ingestion python - <<'PY'
          import base64
          import json
          import os
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          api = "http://metadata-server:8585/api"
          body = json.dumps({
              "email": os.environ["METADATA_ADMIN_EMAIL"],
              "password": base64.b64encode(os.environ["METADATA_ADMIN_PASSWORD"].encode()).decode(),
          }).encode()
          with urlopen(Request(f"{api}/v1/users/login", data=body, headers={"Content-Type": "application/json"})) as response:
              token = json.load(response)["accessToken"]
          headers = {"Authorization": f"Bearer {token}"}

          def get(path):
              with urlopen(Request(f"{api}{path}", headers=headers)) as response:
                  return json.load(response)

          # The original defect was silent incompleteness: a green workflow while
          # the whole dbt staging layer was missing from the catalog. Asserting the
          # entities exist is what makes that failure loud.
          staging = [
              "stg_core__orders",
              "stg_core__order_items",
              "stg_staging__orders",
              "stg_staging__order_items",
          ]
          for name in staging:
              fqn = f"warehouse_postgres.dwh.staging.{name}"
              table = get(f"/v1/tables/name/{quote(fqn, safe='')}")
              assert table.get("columns"), f"{fqn} indexed without columns"
              print(f"indexed {fqn} ({len(table['columns'])} columns)")

          # And that dbt lineage was stitched onto those entities, so the mart is
          # reachable from the staging model rather than from the raw source.
          fqn = "warehouse_postgres.dwh.staging.stg_core__order_items"
          lineage = get(f"/v1/lineage/table/name/{quote(fqn, safe='')}?upstreamDepth=2&downstreamDepth=2")
          reachable = json.dumps(lineage)
          for expected in ("core.order_items", "marts.v_sales_daily"):
              assert expected in reachable, f"{expected} missing from lineage of {fqn}"
          print("dbt staging lineage reaches core and marts")
          PY

      - name: Publish isolated OpenLineage fixture event
        run: |
          docker exec -i de-metadata-ingestion python - <<'PY'
          import json
          from confluent_kafka import Producer

          event = {
              "eventTime": "2026-08-20T00:00:00.000Z",
              "eventType": "COMPLETE",
              "producer": "https://github.com/sergeishaikin/de_practicum_demo/ci-metadata",
              "schemaURL": "https://openlineage.io/spec/2-0-2/OpenLineage.json",
              "job": {"namespace": "de-practicum", "name": "ci.metadata.fixture"},
              "run": {"runId": "00000000-0000-4000-8000-000000000004"},
              "inputs": [{"namespace": "s3://de-practicum", "name": "ci/metadata/orders_raw"}],
              "outputs": [{"namespace": "iceberg://iceberg-rest", "name": "bronze.orders"}],
          }
          producer = Producer({"bootstrap.servers": "kafka:9092"})
          producer.produce("de-practicum-lineage", json.dumps(event).encode())
          producer.flush(30)
          print("isolated OpenLineage fixture published")
          PY

      - name: Run official runtime ingestion and adapter
        run: docker exec de-metadata-ingestion python /opt/metadata/scripts/run_ingestion.py runtime

      - name: Verify deterministic Container lineage and idempotency
        run: |
          docker exec -i de-metadata-ingestion python - <<'PY'
          import base64
          import json
          import os
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          api = "http://metadata-server:8585/api"
          body = json.dumps({
              "email": os.environ["METADATA_ADMIN_EMAIL"],
              "password": base64.b64encode(os.environ["METADATA_ADMIN_PASSWORD"].encode()).decode(),
          }).encode()
          with urlopen(Request(f"{api}/v1/users/login", data=body, headers={"Content-Type": "application/json"})) as response:
              token = json.load(response)["accessToken"]
          headers = {"Authorization": f"Bearer {token}"}

          def get(path):
              with urlopen(Request(f"{api}{path}", headers=headers)) as response:
                  return json.load(response)

          fqn = "landing_object_store.de-practicum.p_ci_x2f_metadata_x2f_orders__raw"
          container = get(f"/v1/containers/name/{quote(fqn, safe='')}")
          assert container["deleted"] is False
          assert container["fullPath"] == "s3://de-practicum/ci/metadata/orders_raw"
          lineage = get("/v1/lineage/table/name/lakehouse_trino.iceberg.bronze.orders")
          edges = [edge for edge in lineage.get("upstreamEdges", []) if edge.get("fromEntity") == container["id"]]
          assert len(edges) == 1, edges
          assert edges[0]["lineageDetails"]["source"] == "OpenLineage"
          assert "00000000-0000-4000-8000-000000000004" in edges[0]["lineageDetails"]["description"]
          print("metadata Container lineage API checks passed")
          PY
          docker exec de-metadata-ingestion python /opt/metadata/scripts/run_ingestion.py runtime

      - name: Capture metadata diagnostics
        if: failure()
        run: |
          docker compose --env-file .env \
            -f docker-compose.yml \
            -f docker-compose.extended.yml \
            -f docker-compose.metadata.yml \
            --profile metadata ps > metadata-profile-ps.txt || true
          docker compose --env-file .env \
            -f docker-compose.yml \
            -f docker-compose.extended.yml \
            -f docker-compose.metadata.yml \
            --profile metadata logs --no-color > metadata-profile.log || true

      - name: Upload metadata diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-profile-evidence
          path: |
            metadata-profile-ps.txt
            metadata-profile.log
          if-no-files-found: ignore

      - name: Metadata-only cleanup
        if: always()
        run: |
          docker compose --env-file .env \
            -f docker-compose.yml \
            -f docker-compose.extended.yml \
            -f docker-compose.metadata.yml \
            --profile metadata down --remove-orphans || true
          docker volume rm \
            de_practicum_metadata_db_data \
            de_practicum_metadata_search_data \
            de_practicum_metadata_dbt_artifacts || true

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dev dependencies
        run: uv sync --locked
      - name: Verify committed dependency locks
        run: |
          sh scripts/lock-python-dependencies.sh
          git diff --exit-code -- \
            uv.lock requirements-dev.txt airflow.requirements.txt \
            dbt/requirements.txt dbt/warehouse/requirements.txt iceberg/requirements.txt jupyter/requirements.txt \
            kafka/producer/requirements.txt observability/requirements.txt \
            spark/requirements.txt
      - name: Validate Compose files
        run: >
          docker compose --env-file .env.example
          -f docker-compose.yml -f docker-compose.extended.yml config --quiet
      - name: Ruff
        run: |
          uv run --locked ruff check .
          uv run --locked ruff check dags --select AIR3 --preview
      - name: Black
        run: uv run --locked black --check .
      - name: SQLFluff (correctness rules only — see .sqlfluff)
        run: uv run --locked sqlfluff lint dbt/warehouse/models dbt/warehouse/tests dbt/models

  unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dev dependencies
        run: uv sync --locked
      - name: Fast unit suite with coverage gate (>= 90%)
        run: uv run --locked pytest tests --cov=iceberg --cov-report=term-missing --cov-fail-under=90

  warehouse-dbt-contract:
    name: Warehouse dbt contract + artifacts
    runs-on: ubuntu-latest
    env:
      DBT_POSTGRES_HOST: localhost
      DBT_POSTGRES_PORT: "15432"
      DBT_POSTGRES_USER: app
      DBT_POSTGRES_PASSWORD: change-me
      DBT_POSTGRES_DB: dwh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "dbt/warehouse/requirements.txt"
      - name: Install warehouse dbt runtime
        run: |
          uv venv --python 3.12 .venv-dbt-warehouse
          uv pip sync --python .venv-dbt-warehouse/bin/python --require-hashes dbt/warehouse/requirements.txt
          cp dbt/warehouse/profiles.yml.example dbt/warehouse/profiles.yml
      - name: Install repository test dependencies
        run: uv sync --locked
      - name: Start PostgreSQL fixture
        run: |
          docker compose --env-file .env.example up -d de-demo-postgres
          for i in $(seq 1 30); do
            docker exec de-demo-postgres pg_isready -U app -d dwh >/dev/null 2>&1 && break
            sleep 2
          done
      - name: Seed staging and rebuild core with the production transform
        run: |
          docker exec -i de-demo-postgres psql -U app -d dwh -v ON_ERROR_STOP=1 \
            < tests/fixtures/warehouse/seed_staging.sql
          docker exec -i de-demo-postgres psql -U app -d dwh -v ON_ERROR_STOP=1 \
            < db/pipeline_sql/10_rebuild_core.sql
      - name: Run warehouse dbt build and docs
        run: |
          .venv-dbt-warehouse/bin/dbt parse --project-dir dbt/warehouse --profiles-dir dbt/warehouse
          .venv-dbt-warehouse/bin/dbt build --project-dir dbt/warehouse --profiles-dir dbt/warehouse
          .venv-dbt-warehouse/bin/dbt docs generate --project-dir dbt/warehouse --profiles-dir dbt/warehouse
          test -s dbt/warehouse/target/manifest.json
          test -s dbt/warehouse/target/run_results.json
          test -s dbt/warehouse/target/catalog.json
          test -s dbt/warehouse/target/index.html
      - name: Assert staging to reconciliation expectations
        run: |
          violations=$(docker exec -i de-demo-postgres psql -U app -d dwh \
            -v ON_ERROR_STOP=1 -At -F '|' < tests/fixtures/warehouse/assert_marts.sql)
          if [ -n "$violations" ]; then
            echo "Warehouse integration expectations failed:"
            echo "$violations"
            exit 1
          fi
      - name: Verify repository contracts
        run: uv run --locked pytest -q tests/test_warehouse_dbt.py
      - name: Upload warehouse dbt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-dbt-artifacts
          path: dbt/warehouse/target/
      - name: Cleanup
        if: always()
        run: docker compose --env-file .env.example down --remove-orphans || true

  airflow-dags:
    name: Airflow DAG validation
    runs-on: ubuntu-latest
    env:
      AIRFLOW_IMAGE_TAG: de-practicum-demo-airflow:0.1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dev dependencies
        run: uv sync --locked
      - name: Cache Airflow image layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: airflow-image-${{ hashFiles('airflow.Dockerfile', 'airflow.requirements.txt', 'airflow.constraints.txt') }}
          restore-keys: airflow-image-
      - name: Build Airflow image (layer-cached)
        run: |
          docker buildx create --use
          docker buildx build --file airflow.Dockerfile \
            --tag "$AIRFLOW_IMAGE_TAG" \
            --load \
            --cache-from=type=local,src=/tmp/.buildx-cache \
            --cache-to=type=local,dest=/tmp/.buildx-cache,mode=max \
            .
      - name: Start base stack (postgres + airflow)
        run: docker compose --env-file .env.example up -d --no-build de-demo-postgres de-demo-airflow
      - name: Wait for airflow container ready
        run: |
          for i in $(seq 1 60); do
            if docker exec de-demo-airflow python -c '
          import json
          import urllib.request
          health = json.load(urllib.request.urlopen("http://127.0.0.1:8080/api/v2/monitor/health", timeout=3))
          assert health["scheduler"]["status"] == "healthy"
          assert health["dag_processor"]["status"] == "healthy"
          assert health["triggerer"]["status"] == "healthy"
          ' >/dev/null 2>&1; then
              echo "airflow ready"
              exit 0
            fi
            sleep 5
          done
          docker compose logs --no-color de-demo-airflow || true
          echo "airflow did not become ready"
          exit 1
      - name: DagBag tests
        run: uv run --locked pytest tests/test_dags.py -m airflow
      - name: Gherkin workflow features
        run: uv run --locked pytest tests/features/test_airflow_workflow_behavior.py -m "bdd and airflow"
      - name: Cleanup
        if: always()
        run: docker compose --env-file .env.example down --remove-orphans

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: iceberg-writer
    static_configs:
      - targets: [iceberg-writer:9101]
  - job_name: iceberg-medallion
    static_configs:
      - targets: [iceberg-medallion:9102]
  - job_name: orders-streaming
    static_configs:
      - targets: [orders-streaming:9103]
  - job_name: durable-metrics-exporter
    static_configs:
      - targets: [observability-exporter:9104]

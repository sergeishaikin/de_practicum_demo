target: all
stream_over_http_enabled: true

server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: s3
    s3:
      endpoint: ${TEMPO_S3_ENDPOINT}
      bucket: ${TEMPO_S3_BUCKET}
      prefix: ${TEMPO_S3_PREFIX}
      access_key: ${TEMPO_S3_ACCESS_KEY}
      secret_key: ${TEMPO_S3_SECRET_KEY}
      insecure: true
    wal:
      path: /var/tempo/wal
    blocklist_poll: 30s

backend_scheduler:
  provider:
    retention:
      interval: 5m
    compaction:
      compaction:
        block_retention: 24h
        compacted_block_retention: 1h
        compaction_window: 1h
        compaction_cycle: 30s

backend_worker:
  compaction:
    block_retention: 24h
    compacted_block_retention: 1h
    compaction_window: 1h

overrides:
  defaults:
    ingestion:
      rate_strategy: local
      rate_limit_bytes: 1048576
      burst_size_bytes: 2097152

usage_report:
  reporting_enabled: false

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    s3:
      endpoint: http://${LOKI_S3_ENDPOINT}
      bucketnames: ${LOKI_S3_BUCKET}
      access_key_id: ${LOKI_S3_ACCESS_KEY}
      secret_access_key: ${LOKI_S3_SECRET_KEY}
      s3forcepathstyle: true

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: ${LOKI_S3_PREFIX}index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index_cache

limits_config:
  retention_period: 48h
  allow_structured_metadata: true
  volume_enabled: true
  discover_log_levels: true
  max_structured_metadata_size: 64KB
  max_structured_metadata_entries_count: 128
  max_query_lookback: 48h

distributor:
  otlp_config:
    default_resource_attributes_as_index_labels:
      - service.name
      - service.namespace
      - deployment.environment.name

compactor:
  working_directory: /loki/retention
  compaction_interval: 10m
  apply_retention_interval: 15m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 2
  delete_request_store: s3
  delete_request_store_key_prefix: ${LOKI_S3_PREFIX}delete_requests/

ruler:
  enable_api: false

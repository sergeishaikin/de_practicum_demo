name: de-practicum-demo

networks:
  de_demo_net:
    name: de_demo_net
    driver: bridge

volumes:
  de_demo_pg_data:
    name: de_demo_pg_data
  de_demo_airflow_logs:
    name: de_demo_airflow_logs
  de_demo_warehouse_dbt_target:
    name: de_demo_warehouse_dbt_target

services:
  de-demo-postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    container_name: de-demo-postgres
    hostname: de-demo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD is required}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:-airflow_meta}
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "15432:5432"
    volumes:
      - de_demo_pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/demo_sql:/demo_sql:ro
      - ./db/tasks:/tasks:ro
      - ./db/task_checks:/task_checks:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped
    networks:
      - de_demo_net

  airflow-db-init:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    container_name: de-demo-airflow-db-init
    environment:
      PGHOST: de-demo-postgres
      PGPORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD is required}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:-airflow_meta}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint-initdb.d/006_airflow_metadata.sh"]
    depends_on:
      de-demo-postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - de_demo_net

  de-demo-airflow:
    build:
      context: .
      dockerfile: airflow.Dockerfile
    image: de-practicum-demo-airflow:0.1.0
    container_name: de-demo-airflow
    hostname: de-demo-airflow
    depends_on:
      airflow-db-init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Europe/Moscow}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: ${TZ:-Europe/Moscow}
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      AIRFLOW_DB_HOST: de-demo-postgres
      AIRFLOW_DB_PORT: "5432"
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD is required}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:-airflow_meta}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD is required}@de-demo-postgres:5432/${AIRFLOW_DB_NAME:-airflow_meta}
      AIRFLOW__API__INSTANCE_NAME: "DE Practicum · Local"
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?AIRFLOW_API_SECRET_KEY is required}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?AIRFLOW_JWT_SECRET is required}
      DWH_HOST: de-demo-postgres
      DWH_PORT: "5432"
      DWH_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      DWH_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      DWH_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DBT_TRINO_HOST: ${DBT_TRINO_HOST:-de-demo-trino}
      DBT_TRINO_PORT: ${DBT_TRINO_PORT:-8080}
      DBT_TRINO_USER: ${DBT_TRINO_USER:-admin}
      DBT_POSTGRES_HOST: ${DBT_POSTGRES_HOST:-de-demo-postgres}
      DBT_POSTGRES_PORT: ${DBT_POSTGRES_PORT:-5432}
      DBT_POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      DBT_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DBT_POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      AIRFLOW__COSMOS__ENABLE_TELEMETRY: "False"
      AIRFLOW__COSMOS__DBT_DOCS_PROJECTS: '{"lakehouse":{"dir":"/opt/airflow/project/dbt/target","index":"index.html","name":"Lakehouse dbt docs"},"warehouse":{"dir":"/opt/airflow/project/dbt/warehouse/target","index":"index.html","name":"Warehouse dbt docs"}}'
      MAINTENANCE_RETENTION: ${MAINTENANCE_RETENTION:-2h}
      MAINTENANCE_RECOVERY_HORIZON: ${MAINTENANCE_RECOVERY_HORIZON:-1h}
      MAINTENANCE_RECOVERY_SAFETY_MARGIN: ${MAINTENANCE_RECOVERY_SAFETY_MARGIN:-15m}
    ports:
      - "127.0.0.1:${AIRFLOW_HOST_PORT:-18085}:8080"
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./db:/opt/airflow/project/db:ro
      - ./dbt:/opt/airflow/project/dbt:rw
      - de_demo_warehouse_dbt_target:/opt/airflow/project/dbt/warehouse/target
      - ./dbt/profiles.yml.example:/opt/airflow/project/dbt/profiles.yml:ro
      - ./dbt/warehouse/profiles.yml.example:/opt/airflow/project/dbt/warehouse/profiles.yml:ro
      - ./data/raw:/opt/airflow/project/data/raw:ro
      - de_demo_airflow_logs:/opt/airflow/logs
    command:
      - airflow
      - standalone
    restart: unless-stopped
    networks:
      - de_demo_net
